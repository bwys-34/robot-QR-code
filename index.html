<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f7">
  <title>人形机器人展厅 | 机器人档案</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light; --ink:#181a1c; --muted:#73777d; --line:#e5e7e9; --paper:#f5f6f7; --white:#fff; --red:#c93232; --green:#267a55; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:inherit; }
    .shell { min-height:100vh; }
    .topbar { height:58px; display:flex; align-items:center; justify-content:space-between; padding:0 max(28px, calc((100vw - 1240px)/2)); border-bottom:1px solid #e6e8ea; background:rgba(255,255,255,.8); backdrop-filter:blur(18px); position:sticky; top:0; z-index:5; }
    .brand { display:flex; align-items:center; gap:11px; font-size:14px; font-weight:600; letter-spacing:0; }
    .brand-mark { width:23px; height:23px; border:1.5px solid var(--ink); border-radius:7px; display:grid; place-items:center; font:500 10px "DM Mono",monospace; }
    .top-meta { color:var(--muted); font-size:12px; }
    main { width:min(1240px, calc(100% - 56px)); margin:0 auto; }
    .intro { padding:48px 0 28px; display:flex; justify-content:space-between; align-items:end; gap:24px; }
    .eyebrow { color:#71767b; font:500 11px "DM Mono",monospace; letter-spacing:1.4px; text-transform:uppercase; }
    h1 { margin:10px 0 8px; font-size:32px; line-height:1.2; letter-spacing:0; font-weight:600; }
    .subtitle { margin:0; color:var(--muted); font-size:14px; }
    .collection { display:flex; align-items:center; gap:10px; color:#666b70; font:12px "DM Mono",monospace; white-space:nowrap; }
    .collection::before { content:""; width:7px; height:7px; border-radius:50%; background:#48a879; box-shadow:0 0 0 3px #48a87920; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; padding-bottom:38px; }
    .robot-card { min-width:0; }
    .robot-card .n-card { border-radius:8px; border-color:#e5e7e9; box-shadow:0 2px 7px #20252c08; transition:transform .25s ease,box-shadow .25s ease; overflow:hidden; }
    .robot-card .n-card:hover { transform:translateY(-3px); box-shadow:0 12px 28px #20252c11; }
    .robot-card .n-card__content { padding:0 !important; }
    .photo { height:235px; background:#f0f1f2; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .photo img { width:100%; height:100%; object-fit:contain; display:block; transition:opacity .25s ease; }
    .robot-card:hover .photo img { opacity:.96; }
    .photo .index { position:absolute; left:15px; top:14px; padding:5px 8px; border-radius:4px; background:#ffffffd9; backdrop-filter:blur(8px); font:11px "DM Mono",monospace; }
    .photo .year { position:absolute; right:15px; top:14px; color:#fff; font:11px "DM Mono",monospace; text-shadow:0 1px 8px #0009; }
    .info { padding:18px 18px 16px; }
    .maker { color:#72767b; font:500 10px "DM Mono",monospace; text-transform:uppercase; letter-spacing:1.1px; }
    h2 { margin:5px 0 2px; font-size:21px; line-height:1.25; letter-spacing:0; font-weight:600; }
    .alias { color:#7a7e82; font-size:12px; }
    .chips { display:flex; gap:6px; flex-wrap:wrap; margin:13px 0 14px; }
    .chips .n-tag { border-radius:4px; font-size:11px; }
    .summary { font-size:12px; line-height:1.8; color:#51565a; min-height:65px; margin:0; }
    .divider { border:0; border-top:1px solid #eceeef; margin:14px 0 12px; }
    .details { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .detail-label { display:block; color:#8a8e92; font-size:10px; margin-bottom:4px; }
    .detail-value { font-size:11px; line-height:1.65; color:#373b3e; }
    .bottom { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:16px; padding-top:13px; border-top:1px solid #eceeef; }
    .qr-inline { display:flex; align-items:center; gap:9px; min-width:0; }
    .qr-box { width:52px; height:52px; border:1px solid #e6e8e9; background:white; border-radius:4px; display:grid; place-items:center; flex:none; overflow:hidden; }
    .qr-box img { width:46px; height:46px; image-rendering:pixelated; }
    .qr-caption { min-width:0; }
    .qr-caption strong { display:block; font-size:11px; font-weight:500; }
    .qr-caption span { display:block; margin-top:3px; color:#8b8f93; font-size:10px; }
    .bottom .n-button { border-radius:5px; font-size:11px; }
    .footer { border-top:1px solid #e1e3e5; padding:16px 0 24px; display:flex; justify-content:space-between; gap:16px; color:#81858a; font-size:11px; }
    .notice { padding:12px 14px; margin:0 0 20px; border:1px solid #ead9b7; background:#fffaf0; border-radius:6px; color:#725b30; font-size:12px; line-height:1.7; }
    .notice strong { font-weight:600; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 16px; }
    .toolbar-left { display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
    .search-field { width:min(380px,100%); }
    .toolbar .n-button,.pagination .n-button { border-radius:5px; }
    .result-count { color:#777c80; font-size:11px; white-space:nowrap; }
    .batch-status { color:#73777d; font-size:11px; min-height:17px; margin:-6px 0 12px; }
    .pagination { display:flex; justify-content:center; align-items:center; gap:14px; padding:4px 0 28px; color:#686d72; font:12px "DM Mono",monospace; }
    .empty-state { padding:48px 18px; text-align:center; color:#74797e; font-size:13px; }
    .focus-view .grid { grid-template-columns:minmax(0, 780px); justify-content:center; }
    .focus-view .photo { height:clamp(270px,42vw,430px); }
    .focus-view .info { padding:22px 24px 20px; }
    .focus-view h2 { font-size:26px; }
    .focus-view .summary { min-height:0; font-size:13px; }
    .focus-view .details { grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 28px; }
    .focus-view .detail-value { font-size:12px; }
    .focus-view .qr-box { width:76px; height:76px; }
    .focus-view .qr-box img { width:68px; height:68px; }
    .focus-view .qr-caption strong { font-size:12px; }
    .focus-view .bottom { margin-top:20px; }
    .focus-nav { margin:10px 0 17px; display:flex; align-items:center; justify-content:space-between; }
    .focus-nav .n-button { border-radius:5px; }
    .load-state { padding:40px; color:var(--muted); text-align:center; }
    @media (max-width:900px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .photo { height:220px; } }
    @media (max-width:620px) {
      .topbar { height:52px; padding:0 18px; } .top-meta { font-size:10px; }
      main { width:calc(100% - 32px); }
      .intro { padding:32px 0 21px; align-items:flex-start; flex-direction:column; gap:12px; }
      h1 { font-size:27px; } .subtitle { font-size:12px; line-height:1.7; }
      .grid { grid-template-columns:minmax(0,1fr); gap:13px; padding-bottom:26px; }
      .photo { height:240px; } .info { padding:16px; }
      .summary { min-height:0; }
      .toolbar { align-items:stretch; flex-direction:column; }
      .toolbar-left { width:100%; justify-content:space-between; }
      .search-field { width:100%; }
      .toolbar > .n-button { width:100%; }
      .result-count { padding-top:4px; }
      .footer { flex-direction:column; gap:5px; }
      .focus-view .photo { height:280px; }
      .focus-view .info { padding:18px 16px; }
      .focus-view h2 { font-size:23px; }
      .focus-view .details { gap:14px; }
      .focus-view .bottom { align-items:flex-end; }
      .focus-nav { gap:8px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; animation-duration:.01ms !important; transition-duration:.01ms !important; } }
    .fade-in { animation:rise .45s both; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>
  <div id="app"><div class="load-state">正在载入机器人档案…</div></div>
  <script src="assets/app-RXH555DZ.js" defer></script>
</body>
</html>
